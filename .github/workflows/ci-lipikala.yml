name: lipikala CI

on:
  pull_request:
    branches: [main]
    paths: ['lipikala/**', '.github/workflows/ci-lipikala.yml']

# CI only reads the repo; never grant the default token anything more.
permissions:
  contents: read

defaults:
  run:
    working-directory: lipikala

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lipikala/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lipikala/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
