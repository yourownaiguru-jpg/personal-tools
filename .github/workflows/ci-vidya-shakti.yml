name: vidya-shakti CI

on:
  pull_request:
    branches: [main]
    paths: ['vidya-shakti/**', '.github/workflows/ci-vidya-shakti.yml']

# CI only reads the repo; never grant the default token anything more.
permissions:
  contents: read

defaults:
  run:
    working-directory: vidya-shakti

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vidya-shakti/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
